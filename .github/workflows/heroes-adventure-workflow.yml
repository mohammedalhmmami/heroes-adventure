# Build unsigned IPA (no Apple Developer account needed for the build)
#
# Runs on a free GitHub macOS runner. The result is an UNSIGNED .ipa
# (Payload/HeroesAdventure.app) — sideload it with SideStore
# using a free Apple ID.
#
# Repo layout: this workflow file at .github/workflows/build-ipa.yml
# plus heroes-adventure.zip at the repo root (contains the HeroesAdventure/
# Xcode project folder). The workflow unzips it, then builds.
#
# Adapted 2026-11-18 from the public MediaClick workflow
# (https://github.com/mohammedalhmmami/mediaclick — build-ipa.yml):
# same structure (macos-latest, Xcode 15.4, unsigned build, IPA packaging,
# artifact upload), with project/scheme/app names changed to HeroesAdventure.

name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f heroes-adventure.zip || { echo "heroes-adventure.zip not found"; ls -la; exit 1; }
          unzip -q heroes-adventure.zip
          ls HeroesAdventure/HeroesAdventure.xcodeproj

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -p

      - name: Build (no signing)
        run: |
          xcodebuild -project HeroesAdventure/HeroesAdventure.xcodeproj \
            -scheme HeroesAdventure \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/HeroesAdventure.app"
          test -d "$APP_PATH" || { echo "HeroesAdventure.app not found"; ls -R build/Build/Products || true; exit 1; }
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r HeroesAdventure-unsigned.ipa Payload
          ls -la HeroesAdventure-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeroesAdventure-unsigned.ipa
          path: HeroesAdventure-unsigned.ipa
          if-no-files-found: error
